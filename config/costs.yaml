# Tangerine Phuket — current SKU prices (Wave 1 interim cost book).
#
# This file ships in the repo and seeds the cost book so the daily review shows
# real margins even though receipt approvals (Wave 3) are not built yet. A
# later wave replaces this with `CostBook.from_book(approval_book)` once
# receipt approvals are flowing; the migration is one line (see
# docs/PRD-WAVE-1.md "Migration path for the interim cost book").
#
# Convention: prices are quoted strings so YAML does not coerce them to float
# (the engine carries Decimal money throughout). Each price is THB per smallest
# unit (CONTEXT.md "Cost unit convention"): per g for solids, per ml for
# liquids, per unit for countables.
#
# --------------------------------------------------------------------------
# Rebuilt 2026-06-30 from Tangerine_Cost_of_Goods.xlsx ("1. Mapped" tab).
# Source priority: Receipt (actually paid) > In-house prep (calc) > Makro web
# (shelf) > existing costs.yaml. Prices are gross (incl VAT); divide by 1.07
# for net. Trailing comments record the source line / pack size so the other
# partner can verify the per-unit maths at PR review. A `[check]` marker flags
# a tentative mapping (proxy product or assumed pack size) to confirm.
#
# COFFEE — two blends are offered:
#   house / tangerine blend  -> coffee-beans-house  (Chann Poochar)
#   dark blend               -> coffee-beans-dark   (Hai pistachio-choc) NEW SKU
#   robusta dark roast       -> coffee-beans-robusta (Hillkoff, concentrates only)
#
# Seed examples chang-keg & beans-arabica removed (not real SKUs).
# Recipe SKUs still without a cost are listed in the workbook's
# "3. Still missing cost" tab (in-house preps needing a prep recipe, or
# specialty items not stocked at Makro). The engine flags those as unpriced.
# --------------------------------------------------------------------------

