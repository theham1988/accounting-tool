# ----------------------------------------------------------------------------
# Loyverse variant SKU -> master SKU mappings. The sync resolves a sold receipt
# line by its per-variant SKU (falling back to the Loyverse item id only when a
# line carries no SKU — see _line_item_id in src/tangerine/loyverse/parser.py),
# so each mapping's `item_id` is the real variant SKU the line will carry, not
# the Loyverse item UUID. SKUs come from menu.tsv (one row per variant, dumped
# via `python scripts/dump_loyverse_items.py > menu.tsv`); an item with N
# variants gets N mapping lines because each variant sells under its own SKU.
# Menu lines with no recipe in the source docs (draught beer, wine, RTD
# cocktails, soft drinks, retail merch, add-on extras) are intentionally NOT
# mapped — they surface in the daily review's "unmapped" section, which is
# their correct home.
# ----------------------------------------------------------------------------
