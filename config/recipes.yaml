# Tangerine Phuket — recipes and SKU mappings (Wave 1 default).
#
# This file ships in the repo and is the operator-editable source of truth for
# recipes and Loyverse-item -> SKU mappings. Recipe changes go through code
# review (PRD user story 22: recipes are high-stakes — a wrong quantity
# silently corrupts every margin number).
#
# Convention (CONTEXT.md "Cost unit convention"): quantities are in the SKU's
# smallest unit — ml for liquids, g for solids, "unit" for countables (eggs,
# slices, pieces). Quantities and target margins are quoted strings so YAML
# does not coerce them to float (the engine carries Decimal money throughout).
#
# Authored from the partner-supplied source documents (Feb 2024–Feb 2026):
#   - Tangerine_Ptor_Revise03092024.xlsx  (drinks: coffee/tea/matcha/yuzu/
#                                          fruit/milk&yogurt/cocoa)
#   - Tangerine Kitchen Recipe.docx       (kitchen food + cold-pressed juice)
#   - Recipe Book Feb 2024 (Sauce & Meat).pdf / menu PDF
#   - menu.tsv                            (Loyverse item ids for mappings)
#
# Granularity: per-variant SKUs (one SKU per blend/brand/menu item), per the
# partner's decision. Quantities for Thai spoon measures are converted at
# 1 tbsp (ช้อนโต๊ะ) = 15, 1 tsp (ช้อนชา) = 5, 1 pinch (หยิบมือ) = 2,
# 1 pepper grind (หมุน) ≈ 0.2, 1 butter knob (ก้อน) ≈ 10. Where the source
# gave a range, the midpoint is used. These are best-effort from the recipe
# book; partners refine quantities through the normal review (PR) flow.
#
# Costs are intentionally omitted from config/costs.yaml for the new ingredient
# SKUs below (no price data in the source docs). The margin engine flags such
# items as "unpriced" and excludes them from totals until a partner fills the
# price — correct Wave 1 behaviour, not a bug.
#
# Segment: the whole recipe book is the cafe/kitchen daytime operation, so all
# recipes below are tagged `cafe`. Bar-segment lines (draught beer, wine, RTD
# cocktails, soft drinks) have no recipe in the source docs and correctly
# surface in the daily review's "unmapped" section.

