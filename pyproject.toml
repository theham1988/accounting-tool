[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tangerine-accounting"
version = "0.1.0"
description = "Tangerine Phuket bar & cafe accounting tool"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    # Wave 1 Slice 2: FastAPI + Jinja2 + HTMX frontend (ADR-0002). HTMX itself
    # is a client-side JS file served as a static asset (no Python dep).
    "fastapi>=0.110",
    "jinja2>=3.1",
    # Wave 1 Slice 4: signed session cookies for the shared-passphrase auth
    # gate. itsdangerous is the standard, audited signer; we use its
    # URLSafeTimedSerializer so cookies are tamper-evident and can carry an
    # expiry. Small pure-Python dep, no transitive deps.
    "itsdangerous>=2.1",
    # Wave 1 Slice 4: ``python-multipart`` backs FastAPI's ``Form(...)`` parsing
    # for the login POST. FastAPI declares it as an extra rather than a hard
    # dep, so we have to list it explicitly.
    "python-multipart>=0.0.9",
    # Issue #66: Loyverse ``created_at`` is UTC; the venue is in Phuket
    # (Asia/Bangkok). ``zoneinfo`` is in the stdlib but needs a timezone
    # database — Linux ships one in /usr/share/zoneinfo, but Windows (dev, CI)
    # and macOS do not, so the ``tzdata`` package is the cross-platform source.
    # It is a no-op on Linux (the system db is found first) and pure data, no
    # runtime cost.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Test client (Starlette's TestClient is built on httpx). Needed by the
    # UI seam tests; not a runtime dependency of the app.
    "httpx>=0.27",
]
# Wave 1 Slice 6: the production ASGI server. The systemd unit runs the app via
# ``uvicorn tangerine.web.app:create_app --factory`` behind nginx (see
# ``deploy/`` and ``DEPLOY.md``). Kept out of the core dependencies so test and
# CI environments do not pull a server they never start; the VPS installs it
# with ``pip install -e ".[serve]"``.
serve = [
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tangerine = ["py.typed"]
"tangerine.storage.migrations" = ["*.sql"]
"tangerine.web" = [
    "templates/*.html",
    "static/*",
    "static/tokens/*",
    "static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
packages = ["tangerine"]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
