# Tangerine Phuket — nginx site config (Wave 1, Slice 6).
#
# nginx terminates TLS (Let's Encrypt / certbot) and reverse-proxies to the
# uvicorn app on 127.0.0.1:8000. Install:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tangerine
#   sudo ln -s /etc/nginx/sites-available/tangerine /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace tangerine.example.com with the real hostname before installing.
# See DEPLOY.md for the certbot bootstrap (this file assumes certs exist).

# ---- HTTP :80 — ACME challenge + redirect everything else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name tangerine.example.com;

    # certbot's webroot challenge files (used on first issuance and renewals).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Slice-6 AC: HTTP requests redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 — TLS termination + reverse proxy to uvicorn ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tangerine.example.com;

    ssl_certificate     /etc/letsencrypt/live/tangerine.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangerine.example.com/privkey.pem;
    # Modern TLS defaults written by certbot.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The DB snapshot download can be large-ish; allow a generous body/timeout.
    client_max_body_size 64m;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append the real peer to any client-supplied header. The app's login
        # rate-limiter keys on the RIGHT-MOST entry (the address nginx actually
        # saw), so a spoofed X-Forwarded-For sent by the client is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
